<style>
  :root {

  :root[data-theme="dark"] {

    --panel: 29 27 25; --good: 110 231 183; --e50: 6 78 59;

  .btn-dark { background: rgb(var(--btn-dark)); color: rgb(var(--btn-dark-text)); }
  @media (hover: hover) { .btn-dark:hover:not(:disabled) { background: rgb(var(--btn-dark-hover)); } }
  .check-badge { background: rgb(var(--btn-dark)); color: rgb(var(--btn-dark-text)); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: rgb(var(--s50));
    color: rgb(var(--s800));
    min-height: 100vh;
    min-height: 100dvh;
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  button { font-family: inherit; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  .tnum { font-variant-numeric: tabular-nums; }
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  @keyframes tumble {
    0%   { transform: translateY(0) rotate(0deg) scale(1); }
    18%  { transform: translateY(-28px) rotate(-18deg) scale(1.06); }
    36%  { transform: translateY(0) rotate(14deg) scale(1); }
    54%  { transform: translateY(-13px) rotate(-8deg) scale(1.03); }
    72%  { transform: translateY(0) rotate(4deg) scale(1); }
    86%  { transform: translateY(-4px) rotate(-1deg); }
    100% { transform: translateY(0) rotate(0deg) scale(1); }
  }
  .die-rolling {
    animation: tumble 0.85s cubic-bezier(0.34, 0.1, 0.4, 1) backwards;
    animation-delay: var(--d, 0ms);
  }
  @keyframes settle {
    0%   { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .settle { animation: settle 0.28s ease-out both; }
  @keyframes bump {

          h(Btn, { variant: 'dark', onClick: bank, disabled: !info.valid || (needEntry && moreRolls), className: 'flex-1 sm:flex-none sm:min-w-[150px]' }, bankLabel));
      }
      actionBar = buttons ? h('div', {
        className: 'fixed bottom-0 inset-x-0 z-40 bg-panel border-t border-stone-200 shadow-[0_-6px_20px_rgba(41,37,36,0.06)] px-4 pt-2.5 pb-[calc(0.625rem+env(safe-area-inset-bottom))] sm:static sm:shadow-none sm:bg-transparent sm:border-0 sm:p-0 sm:mt-5'
      }, h('div', { className: 'max-w-md mx-auto sm:max-w-none' }, buttons)) : null;

      mainBody = h('div', null,
        h('div', { className: 'flex items-center justify-between gap-3' },
          h('h2', { className: 'min-w-0 text-xl sm:text-2xl font-extrabold tracking-tight text-stone-900 truncate' },
            cur.name + (cur.name.slice(-1).toLowerCase() === 's' ? '’ turn' : '’s turn')),
          h(ThemeBtn, { theme: theme, onClick: toggleTheme, small: true })),
        h('div', { className: 'mt-1.5 flex items-end justify-between gap-3' },
          rollDots,
          h('div', { className: 'text-right shrink-0' },
            h('div', { className: 'flex items-baseline justify-end gap-2 text-xs sm:text-sm' },
              h('span', { className: 'text-stone-500' }, 'Turn score'),
              h('span', { className: 'font-semibold text-good tnum' }, choose && info.valid && delta > 0 ? '+' + fmt(delta) : '')),
            h('p', {
              key: 'ts' + shown,
              className: 'bump mt-0.5 text-3xl sm:text-4xl font-extrabold tracking-tight tnum leading-none ' + (bust ? 'text-rose-700' : 'text-stone-900')
            }, fmt(shown)))),

        h('div', { className: 'mt-3 sm:mt-6 flex items-center flex-wrap gap-2 min-h-[40px] sm:min-h-[56px]' },
          h('span', { className: 'text-sm font-semibold text-stone-700 mr-1' }, 'Kept'),
          g.held.map(function (d) { return h(Die, { key: 'h' + d.id, id: d.id, value: d.value, small: true, held: true }); }),
          h('span', { className: 'ml-auto text-sm text-stone-500 tnum' },
            (g.locked > 0 ? 'Locked in ' + fmt(g.locked) + (heldScore > 0 ? ', ' : '') : '') + (heldScore > 0 ? 'Pool ' + fmt(heldScore) : (g.locked > 0 ? '' : 'Nothing kept yet')))),

        h('div', {
          className: 'mt-3 sm:mt-5 rounded-2xl border px-3 sm:px-6 py-4 sm:py-8 min-h-[182px] sm:min-h-[150px] flex items-center justify-center transition-colors duration-300 ' +
            (bust ? 'border-rose-200 bg-rose-50/60' : 'border-stone-200/70 bg-stone-50')
        },
          h('div', { className: 'flex flex-wrap justify-center gap-3 sm:gap-4 w-full max-w-[300px] sm:max-w-none' }, tray)),

        h('div', { className: 'mt-3 sm:mt-5 text-center min-h-[64px]', 'aria-live': 'polite' },
          h('p', { key: g.phase + g.rollKey + msg, className: 'settle text-[15px] sm:text-[16px] font-semibold ' + tone },
            isAI && !turnEnd ? h('span', { className: 'inline-block w-2 h-2 rounded-full bg-emerald-700 animate-pulse mr-2 align-middle' }) : null, msg),
          sub ? h('p', { className: 'mt-1 text-sm text-stone-500' }, sub) : null,
          choose && !isAI ? h('button', {
            type: 'button', onClick: autoPick,
            className: 'mt-1 px-3 py-1.5 text-sm font-semibold text-good rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-700/60'
          }, 'Pick best') : null));
    }

    var finalBanner = g.final && g.screen === 'play'
      ? h('div', { className: 'settle mb-2 sm:mb-3 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-2 sm:py-3 text-sm sm:text-[15px] text-amber-900' },
          h('span', { className: 'font-bold' }, 'Final round. '),
          'Everyone else gets one more turn to beat ' + fmt(leader) + '.')
      : null;

    

    return h('div', { className: 'px-3 sm:px-4 pt-3 sm:pt-12 ' + (g.screen === 'play' && !isAI ? 'pb-28 sm:pb-12' : 'pb-8 sm:pb-12') },
      h('div', { className: 'max-w-5xl mx-auto' },
        h('header', { className: 'flex items-center justify-between gap-3 mb-2.5 sm:mb-7' },
          h('div', { className: 'flex items-center gap-3 min-w-0' },
            h('h1', { className: 'text-xl sm:text-3xl font-extrabold tracking-tight text-stone-900' }, '10K Tumble'),
            h('span', { className: 'hidden sm:inline text-sm text-stone-500 bg-panel border border-stone-200/70 rounded-full px-3 py-1' }, 'First to ' + fmt(TARGET))),
          h('div', { className: 'flex items-center gap-2 shrink-0' },
            h(Btn, { variant: 'ghost', small: true, onClick: function () { setRules(true); } }, 'Rules'),
            h(Btn, { variant: 'ghost', small: true, onClick: function () { if (confirmNew || g.screen === 'over') toSetup(); else setConfirmNew(true); } },
              h('span', { className: 'sm:hidden' }, confirmNew ? 'Sure?' : 'New game'),
              h('span', { className: 'hidden sm:inline' }, confirmNew ? 'Tap to confirm' : 'New game')))),
        h(ScoreStrip, { g: g }),
        finalBanner,
        h('div', { className: 'grid lg:grid-cols-[1fr_320px] gap-5 sm:gap-6 items-start' },
          h('main', { className: panel }, mainBody, g.screen === 'over' ? null : actionBar),
          h(Scoreboard, { g: g }))),
      rulesModal);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
